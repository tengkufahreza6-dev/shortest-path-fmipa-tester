<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="2; url=./public/assets/index.html">
    <title>FMIPA Map - Mengalihkan</title>
    <style>
        /* Mengatur dasar halaman agar elemen berada di tengah */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        /* Wadah utama kartu */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 60px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
        }

        /* Judul Aplikasi */
        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: #2c3e50;
            letter-spacing: 1px;
        }

        /* Teks Memuat */
        p {
            margin: 0 0 25px 0;
            font-size: 16px;
            color: #7f8c8d;
        }

        /* Animasi Spinner Loading */
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            margin: 0 auto;
            animation: spin 1s linear infinite;
        }

        /* Logika rotasi spinner */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FMIPA Map</h1>
        <p>Memuat aplikasi, mohon tunggu...</p>
        <div class="spinner"></div>
    </div>

    <script>
        // Mengantisipasi jika meta refresh tidak bekerja di browser tertentu
        setTimeout(function() {
            window.location.href = './public/assets/index.html';
        }, 2000); // Dijeda 2 detik agar animasi loading sempat terlihat
    </script>
</body>
</html>
